# Dependabot version updates.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Desktop app frontend (React/Vite/Tauri JS API)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      tauri:
        patterns: ["@tauri-apps/*"]

  # Landing site
  - package-ecosystem: "npm"
    directory: "/landing"
    schedule:
      interval: "weekly"

  # Tauri backend (Rust)
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    groups:
      tauri:
        patterns: ["tauri*"]
